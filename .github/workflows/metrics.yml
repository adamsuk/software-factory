name: metrics

# Weekly factory metrics (#340). Runs the read-only metric scripts for the last
# seven UTC days and opens a pull request adding metrics/<date>.md. The first
# snapshot's `## Baseline` section is the reference; this workflow only adds
# the new window's tables.
#
# TOKEN: no workflow in this repo uses the factory bot (GitHub App) token; it is
# minted on the factory host (scripts/gh-app-token.sh). So the PR is opened with
# the workflow's GITHUB_TOKEN. A PR created by GITHUB_TOKEN does NOT trigger the
# required checks, and the issue asks for the factory bot to open it. The
# maintainer decides: supply an App token secret, or close and reopen the PR.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".
#
# The delivery script's ledger lives on the factory host, so it is not read
# here: rework rounds and cost per change show n/a.

on:
  schedule:
    - cron: "23 6 * * 1" # 06:23 UTC on Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    name: metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: metrics
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect the metrics
        run: |
          set -euo pipefail
          until=$(date -u +%F)
          since=$(date -u -d "$until - 7 days" +%F)
          {
            scripts/factory-label-metrics.sh --repo "$GITHUB_REPOSITORY" --since "$since" --until "$until"
            echo
            scripts/factory-pr-metrics.sh --repo "$GITHUB_REPOSITORY" --since "$since" --until "$until"
            echo
            scripts/factory-delivery-metrics.sh --repo "$GITHUB_REPOSITORY" --since "$since" --until "$until" \
              --ledger "$RUNNER_TEMP/no-ledger.csv" \
              --required-check ShellCheck --required-check "changelog / changelog" \
              --required-check tests --required-check "Test assertions"
          } > "$RUNNER_TEMP/metrics.md"
          echo "until=$until" >> "$GITHUB_ENV"
      - name: Open the pull request
        run: |
          set -euo pipefail
          branch="factory/metrics-$until"
          file="metrics/$until.md"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A pull request for $branch is already open."
            exit 0
          fi
          cp "$RUNNER_TEMP/metrics.md" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$file"
          git commit -m "docs: weekly factory metrics $until (#340)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: weekly factory metrics $until (#340)" --label skip-changelog \
            --body "Weekly factory metrics, recorded as \`$file\`. Refs #340. Generated by the metrics workflow; the baseline is in the first snapshot."
