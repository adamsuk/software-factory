name: metrics

# Weekly factory metrics (#340). Runs the read-only metric scripts for the last
# seven UTC days and opens a pull request adding metrics/<date>.md. The first
# snapshot's `## Baseline` section is the reference; this workflow only adds
# the new window's tables.
#
# TOKEN (#355): the pull request is opened with a short-lived installation token
# minted from the factory GitHub App, so the required checks run on it (a PR
# opened with GITHUB_TOKEN does not trigger them). Actions secrets, by name only:
#   FACTORY_GH_APP_ID, FACTORY_GH_APP_PRIVATE_KEY
# The metric scripts still read with the workflow's GITHUB_TOKEN. The App needs
# Contents and Pull requests write on this repo.
#
# LEDGER: the delivery script's cost ledger lives on the factory host and is not
# readable from CI, so rework rounds and cost per change are n/a in each
# snapshot. Each snapshot says so in its "## Ledger" note rather than inventing
# numbers (#355).

on:
  schedule:
    - cron: "23 6 * * 1" # 06:23 UTC on Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    name: metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: metrics
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Mint the App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FACTORY_GH_APP_ID }}
          private-key: ${{ secrets.FACTORY_GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Collect the metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          until=$(date -u +%F)
          since=$(date -u -d "$until - 7 days" +%F)
          {
            scripts/factory-label-metrics.sh --repo "$GITHUB_REPOSITORY" --since "$since" --until "$until"
            echo
            scripts/factory-pr-metrics.sh --repo "$GITHUB_REPOSITORY" --since "$since" --until "$until"
            echo
            scripts/factory-delivery-metrics.sh --repo "$GITHUB_REPOSITORY" --since "$since" --until "$until" \
              --ledger "$RUNNER_TEMP/no-ledger.csv" \
              --required-check ShellCheck --required-check "changelog / changelog" \
              --required-check tests --required-check "Test assertions"
          } > "$RUNNER_TEMP/metrics.md"
          {
            echo
            echo "## Ledger"
            echo
            echo "The cost ledger lives on the factory host and is not readable from CI, so rework rounds per pr and cost per change usd are n/a in this snapshot (#355)."
          } >> "$RUNNER_TEMP/metrics.md"
          echo "until=$until" >> "$GITHUB_ENV"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="factory/metrics-$until"
          file="metrics/$until.md"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A pull request for $branch is already open."
            exit 0
          fi
          cp "$RUNNER_TEMP/metrics.md" "$file"
          git config user.name "software-factory-line[bot]"
          git config user.email "noreply@github.com"
          git switch -c "$branch"
          git add "$file"
          git commit -m "docs: weekly factory metrics $until (#340)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: weekly factory metrics $until (#340)" --label skip-changelog \
            --body "Weekly factory metrics, recorded as \`$file\`. Refs #340. Generated by the metrics workflow; the baseline is in the first snapshot."
