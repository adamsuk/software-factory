name: Lint

on:
  pull_request:
    # labeled/unlabeled so the Test assertions job re-runs when Scott adds or
    # removes the approved-test-change override.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck (pinned, checksum-verified)
        env:
          # The one place the version lives; a bump is this line plus the digest below.
          SHELLCHECK_VERSION: "0.11.0"
          # SHA256 of shellcheck-v<version>.linux.x86_64.tar.gz from the official release.
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          actual="$(sha256sum "$dir/$archive" | cut -d' ' -f1)"
          if [ "$actual" != "$SHELLCHECK_SHA256" ]; then
            echo "::error::ShellCheck digest mismatch for $archive: expected $SHELLCHECK_SHA256, got $actual. Refusing to run it."
            exit 1
          fi
          tar -xzf "$dir/$archive" -C "$dir"
          echo "$dir/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          shellcheck --version
          shellcheck scripts/*.sh adapters/*/run.sh

  test-assertions:
    name: Test assertions
    # Pull requests only: there is no base to diff against on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail on a weakened existing test assertion
        env:
          # Through the environment, not an inline expression: label names are
          # attacker-controlled text and must never be interpolated into the
          # shell (AGENTS.md section 1).
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          label=no
          if printf '%s' "$LABELS" | grep -qF '"approved-test-change"'; then
            label=yes
          fi
          # checkout used fetch-depth: 0, so history is complete; this just
          # makes sure the base branch has a local remote-tracking ref.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          scripts/check-test-assertions.sh \
            --base "origin/$BASE_REF" --head HEAD --label-present "$label"

  tests:
    name: tests
    runs-on: ubuntu-latest
    # Suites poll (test-wait-for-review-bot.sh); the whole job takes about 75 seconds.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        # PyYAML: gate-issue.sh and review-issue.sh parse .github/factory.yml with it.
        # jq, GNU find and bash 5 already ship on ubuntu-latest.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: Run every scripts/test-*.sh
        # No token is passed: the suites put a fake gh on PATH and must never reach the API.
        run: |
          failed=()
          {
            echo '| Suite | Exit |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for suite in scripts/test-*.sh; do
            echo "::group::$suite"
            status=0
            bash "$suite" || status=$?
            echo "::endgroup::"
            echo "$suite exited $status"
            echo "| \`$suite\` | $status |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then
              failed+=("$suite")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::${#failed[@]} suite(s) failed: ${failed[*]}"
            exit 1
          fi
