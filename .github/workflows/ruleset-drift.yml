name: Ruleset drift

# Weekly, and on demand. Fails the job when an enrolled repo's enforced ruleset
# differs from its factory.yml (required_checks, bypass_actors). Read-only.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruleset-drift:
    name: Ruleset drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # checkout and the gh extension clone reach github.com; gh and the extension call api.github.com.
          # Proven by a workflow_dispatch run of this job in block mode on the branch that set it (adamsuk/software-factory#379).
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check rulesets against factory.yml
        env:
          # Needs a read-only token that can see every enrolled repo (including private ones);
          # the default GITHUB_TOKEN only sees this repo.
          GH_TOKEN: ${{ secrets.FACTORY_READ_TOKEN }}
        run: |
          # Pinned to gh-factory main after #47 and #49 (45fa31482f0b2243bbb083156b4c8589c3679fe3): unpinned tracks
          # main, and this extension runs with FACTORY_READ_TOKEN, which can read every
          # enrolled private repo. Script extensions pin by commit, not tag (gh's own
          # --pin docs).
          gh extension install adamsuk/gh-factory --pin 45fa31482f0b2243bbb083156b4c8589c3679fe3
          # Explicit owner: without --owner, plan searches only the token's own account
          # and can find zero repos. The scheduled run covers this repo's owner only.
          bash scripts/ruleset-drift-check.sh --owner "${{ github.repository_owner }}"
