name: Ruleset drift

# Weekly, and on demand. Fails the job when an enrolled repo's enforced ruleset
# differs from its factory.yml (required_checks, bypass_actors). Read-only.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruleset-drift:
    name: Ruleset drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check rulesets against factory.yml
        env:
          # Needs a read-only token that can see every enrolled repo (including private ones);
          # the default GITHUB_TOKEN only sees this repo.
          GH_TOKEN: ${{ secrets.FACTORY_READ_TOKEN }}
        run: |
          # Pinned to v0.6.0 (5326ede2333944e41e90ab6d7650a7c2b307db0a): unpinned tracks
          # main, and this extension runs with FACTORY_READ_TOKEN, which can read every
          # enrolled private repo. Script extensions pin by commit, not tag (gh's own
          # --pin docs).
          gh extension install adamsuk/gh-factory --pin 5326ede2333944e41e90ab6d7650a7c2b307db0a
          # Explicit owner: without --owner, plan searches only the token's own account
          # and can find zero repos. The scheduled run covers this repo's owner only.
          bash scripts/ruleset-drift-check.sh --owner "${{ github.repository_owner }}"
