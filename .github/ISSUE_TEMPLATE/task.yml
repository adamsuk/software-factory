name: Task
description: A change to make, with clear acceptance criteria
body:
  - type: textarea
    id: target
    attributes:
      label: Target repository
      description: The one repository this change lands in. Replace owner/repo and leave a single line.
      value: |
        Target repo: owner/repo
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Leave room for the implementer to choose how.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it is done. One checkable item per line. Each item names a path under scripts/ or a workflow job (the job id and its .github/workflows file).
      placeholder: |
        - [ ] scripts/check-issue-template-checks.sh exits zero on .github/ISSUE_TEMPLATE
        - [ ] the tests job in .github/workflows/lint.yml exits zero
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, screenshots, logs.
    validations:
      required: false
