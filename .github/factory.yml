# software-factory's own gh-factory overrides (see adamsuk/gh-factory README, "Per-repo overrides").

# Factory agents (see the gh-factory README, "Agents"). The maintainer approved agent merges here on
# 2026-10-25 and turned them off on 2026-10-26 (see `merge` below). Intake is enabled alongside
# builder and reviewer, and the issue label stays `factory`.
agents:
  roles: [intake, builder, reviewer]
  # Off since 2026-10-26: on the Free plan a private repo can't enforce required checks or branch
  # protection, so the 'checks are green' merge rule is always met. Stays off until a ruleset enforces
  # required checks and branch protection on main, not just until one exists.
  merge: false
  # CodeRabbit reviews PRs here (it reviewed #32; it hadn't on #29 to #31), so a merge also needs no
  # blocking CodeRabbit findings, plus PR Reviewer's review (AGENTS.md section 6).
  review_bot: coderabbit
  # Runs on the factory box, so it is a SUBSET of what the `tests` CI job runs (every
  # scripts/test-*.sh on ubuntu-latest). Six suites pass in CI but fail on the box for
  # environment reasons, so they are left out here (#164 tracks closing the gap):
  #   test-watcher-tree.sh          find -printf is GNU-only; the box has bfs
  #   test-station-post.sh          jq 1.6 mis-tokenises `label` in {name: $label}
  #   test-gate-issue.sh            PyYAML not importable by the box's python3
  #   test-review-issue.sh          same
  #   test-factory-pr-metrics.sh    BSD date vs GNU date
  #   test-factory-label-metrics.sh same class, undiagnosed
  # A green local test_command is therefore weaker evidence than a green `tests` check.
  test_command: shellcheck scripts/*.sh adapters/*/run.sh && bash scripts/test-adapters.sh && bash scripts/test-check-test-assertions.sh && bash scripts/test-factory-flagged.sh && bash scripts/test-run-work-order.sh && bash scripts/test-run-work-order-llm.sh && bash scripts/test-station-run.sh && bash scripts/test-wait-for-review-bot.sh && bash scripts/test-research-brief.sh

# The ShellCheck check means shellcheck 0.11.0, pinned and checksum-verified in
# .github/workflows/lint.yml (#155); install the same version locally (see README.md).
# Station 04 (scripts/gate-issue.sh) reads these names. This tightens the factory's gate only:
# GitHub enforces these through the factory-main ruleset, which also requires
# "Test assertions" (lint.yml) -- not listed here, a separate gap from #219's scope.
# agents.merge stays false (see above).
required_checks:
  - ShellCheck
  - changelog / changelog
  - tests
