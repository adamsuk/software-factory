# software-factory's own gh-factory overrides (see adamsuk/gh-factory README, "Per-repo overrides").

# Factory agents (see the gh-factory README, "Agents"). Scott approved agent merges here on
# 2026-10-25 and turned them off on 2026-10-26 (see `merge` below). Intake is enabled alongside
# builder and reviewer, and the issue label stays `factory`.
agents:
  roles: [intake, builder, reviewer]
  # Off since 2026-10-26: on the Free plan a private repo can't enforce required checks or branch
  # protection, so the 'checks are green' merge rule is always met. Stays off until a ruleset enforces
  # required checks and branch protection on main, not just until one exists.
  merge: false
  # CodeRabbit reviews PRs here (it reviewed #32; it hadn't on #29 to #31), so a merge also needs no
  # blocking CodeRabbit findings, plus PR Reviewer's review (AGENTS.md section 6).
  review_bot: coderabbit
  # The CI lint job (ShellCheck on the work-order runner).
  test_command: shellcheck scripts/*.sh
