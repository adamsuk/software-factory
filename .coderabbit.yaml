# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit approves PRs with no blocking findings and requests changes otherwise,
# so its approval can be one part of the sign-off gate. (Replaces the deprecated
# reviews.request_changes_workflow.)
reviews:
  auto_approvals:
    enabled: false

  # CodeRabbit reviews here; it does not write here (#142).
  #
  # Every one of these defaults to true, so until 2026-10-28 CodeRabbit held
  # standing permission to commit code and generate tests in this repo. It used
  # it: commit 96e5e3e landed on factory/140-provider-adapters and changed an
  # existing assertion in scripts/test-gate-issue.sh so the test passed against
  # an error string the code no longer produced.
  #
  # AGENTS.md 10.3 allows CodeRabbit fixes on ordinary PRs only, and reserves
  # protected, CI, test and lockfile PRs for Grok Build. These switches are
  # global booleans with no path scope, so that rule cannot be expressed here.
  # path_filters would scope by path but also drives CodeRabbit's sparse
  # checkout, so it would stop CodeRabbit *reviewing* the riskiest files. Review
  # on those files is worth more than autofix on ordinary ones, so all writing
  # is off and every fix comes from Grok Build or a person.
  #
  # NOT fully closed by this file. CodeRabbit's "autopilot" is a separate
  # feature with no key in schema.v2.json, and its "Autofix - Keep fixing
  # CodeRabbit findings and required CI" checkbox still rendered on PR #143
  # after CodeRabbit had read this file at commit 9c6c3e8 with all four
  # switches already false. Turning autopilot off is a dashboard setting only
  # the maintainer can change. Until they do, a person ticking that box can still make
  # CodeRabbit commit here.
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    unit_tests:
      enabled: false
    docstrings:
      enabled: false
